# Checks the website against the lab kit of each course, then publishes it to Azure Static Web Apps.
# The checks run on every push, on any branch. The deployment runs on main only, and only when every check passes,
# so a branch can carry work that is not ready to publish.
# The secret AZURE_STATIC_WEB_APPS_API_TOKEN holds the deployment token of the Static Web Apps resource (infra/).
name: Check and deploy the website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      KITS_DIR: ${{ github.workspace }}
    steps:
      # The repositories sit side by side, as on the author's computer, so that the checker of the website does
      # not scan a kit as part of the site. Each course under courses/<name>/ has its kit <name>-labs.
      - name: Check out the website
        uses: actions/checkout@v7
        with:
          path: website

      # A branch of the website is checked against the branch of the same name in the kit when it exists,
      # and against main otherwise. Delete a branch of the kit once it is merged, or a later website branch of
      # the same name would be checked against it.
      - name: Choose the branch of the kit
        id: kit
        env:
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          status=0
          git ls-remote --exit-code "https://github.com/${OWNER}/kubernetes-labs.git" "refs/heads/${BRANCH}" > /dev/null || status=$?
          case "$status" in
            0) ref="$BRANCH" ;;
            2) ref="main" ;;
            *)
              echo "Could not list the branches of the kit (git ls-remote exit code ${status})." >&2
              exit 1
              ;;
          esac
          echo "The website branch ${BRANCH} is checked against the kit at ${ref}."
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out the kit of course 1
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kubernetes-labs
          ref: ${{ steps.kit.outputs.ref }}
          path: kubernetes-labs

      - name: HTML pages
        working-directory: website
        run: npx --yes html-validate@11.21.1 "**/*.html"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Terraform of the hosting
        working-directory: website
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra init -backend=false -input=false > /dev/null
          terraform -chdir=infra validate

      - name: Course rules, links, redirects, lab sheets, search index and checks against the kits
        working-directory: website
        run: python3 scripts/check-course.py

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v7

      - name: Collect the pages
        run: |
          mkdir _site
          cp -r ./*.html staticwebapp.config.json assets archive courses _site/

      - name: Name the account of the lab kits in assets/kit.js
        env:
          KIT_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ ! "$KIT_OWNER" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "Unexpected account name: ${KIT_OWNER}" >&2
            exit 1
          fi
          printf '/* Written by the deployment workflow. Never committed. */\nwindow.COURSE_KIT = { owner: "%s" };\n' "$KIT_OWNER" > _site/assets/kit.js

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          output_location: ""
          skip_app_build: true
